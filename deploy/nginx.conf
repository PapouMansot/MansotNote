# Requêtes arrivant en clair par l'IP du serveur (port 8793) : le cookie de
# session ne doit jamais circuler sans TLS. Seule la page de migration locale
# reste tolérée, car elle doit lire le localStorage de l'ancienne origine.
map $http_host $legacy_plain_http {
  default            0;
  "192.168.1.47:8793" 1;
}

# En clair, seule `?action=local_migration_source` est servie ; tout le reste
# est renvoyé vers HTTPS pour qu'aucun mot de passe ne parte sans chiffrement.
map "$legacy_plain_http:$arg_action" $block_plain_app {
  "~^1:local_migration_source$" 0;
  "~^1:"                        1;
  default                       0;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Les PUT /workspace (autosave) peuvent dépasser le body par défaut de
  # nginx (1 Mo) : l'API accepte jusqu'à 15 Mo, sans ça c'est un 413.
  client_max_body_size 20m;

  # IA : générations potentiellement longues, toujours authentifiées par l'API.
  location /api/v1/ai/ {
    proxy_pass http://mansotnote-api:3000/v1/ai/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_set_header Connection '';
    tcp_nodelay on;
  }

  # API MansotNote : authentification native + workspace PostgreSQL.
  location /api/ {
    # Permet l'accès aux clients HTTPS et aux clients locaux de l'extension
    proxy_pass http://mansotnote-api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Supabase Storage : médias publics et images intégrées aux notes
  location /storage/ {
    proxy_pass http://supabase-envoy:8000/storage/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # Ancien relais Ollama définitivement désactivé : ne jamais retomber sur la SPA.
  location ^~ /ollama/ {
    return 404;
  }

  # SPA : toutes les routes applicatives reviennent sur index.html.
  location / {
    if ($block_plain_app) { return 301 https://notes.mansotfamily.fr$request_uri; }
    try_files $uri $uri/ /index.html;
  }

  # Assets Vite fingerprintés : cache long et immuable.
  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Le shell HTML doit être revalidé à chaque chargement pour prendre les
  # nouvelles versions du bundle et du bookmarklet.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  include /etc/nginx/security-headers.conf;
}
