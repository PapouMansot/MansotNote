# En-têtes de sécurité communs.
# Nginx annule tous les `add_header` hérités dès qu'un bloc `location` en
# déclare un : ce fichier est donc inclus dans CHAQUE location qui ajoute
# ses propres en-têtes, sans quoi la protection disparaît silencieusement.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
